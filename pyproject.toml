[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agno-travel-agent"
version = "0.1.0"
description = "Travel Itinerary Planner using CAG + RAG with Agno workflow orchestration"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "agno==1.7.4",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.9",
    "pgvector==0.3.2",
    "pydantic==2.9.2",
    "sse-starlette==2.1.3",
    "python-dotenv==1.0.1",
    "google-genai==1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: tests that require a live PostgreSQL database and Gemini API key",
]

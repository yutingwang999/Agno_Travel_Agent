# rebuild-rag step d: vector candidates reranked by a Cross-Encoder, on the chosen query.
# Run with --retrieval-only: these steps compare Recall, MRR and retrieval latency.
name: rebuild-rag-d
description: Top 20 vector candidates reranked by a Cross-Encoder on the CPU, filtered by destination, corpus v2, chunks of 800 characters with 80 overlap
generation_model: gemini-3.1-flash-lite
embedding_model: gemini-embedding-001
judge_model: gpt-6-luna
corpus_version: v2
knowledge_table: travel_docs_v2_c800
embedding_task_types: retrieval
destination_filter: true
search_mode: vector_rerank
retrieval_k: 5
judge_concurrency: 8
request_parser: false

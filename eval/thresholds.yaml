# Regression gate (design decision 21): the smoke subset must stay within these bounds.
# Each gated metric has a `min` (fail when below) or a `max` (fail when above).
# Values are set from two smoke runs of the configuration below: the worse of the two,
# loosened by one entry of the metric's own denominator. First set in task 6.3 from the
# v0.1.0 baseline; reset in rebuild-rag task 8.1 for the final configuration (corpus v2).
# Every change to a value must be recorded in the "Threshold change log" of
# docs/experiments.md, with the change that caused it and the reason.
config: rebuild-rag-gen-c-no-exclusives
subset: smoke

metrics:
  format_pass_rate:
    path: metrics.system.format_pass_rate
    min: 0.875
  trip_length_rate:
    path: metrics.constraints.trip_length_rate
    min: 0.875
  budget_rate:
    path: metrics.constraints.budget_rate
    min: 0.833
  recall_at_5:
    path: metrics.retrieval.recall_at_k
    min: 0.444
  error_rate:
    path: metrics.system.error_rate
    max: 0.1
